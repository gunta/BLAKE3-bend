name: turboblake release

# A turboblake-v<version> tag (scripts/release/tag.sh) publishes that
# version everywhere, from one build:
#
#   1. turboblake-build.yml builds and tests every package on every platform
#   2. a draft GitHub release gets every file, SHA256SUMS, and a signed
#      build provenance attestation for each (gh attestation verify)
#   3. crates.io, npm and PyPI, each by trusted publishing (OIDC: no
#      long-lived token), each skipped if that version is already there, so
#      a failed run can simply be re-run
#   4. once all three have it, the release is published; then the Go module
#      tag (bend/go/v<version>), the Homebrew tap (tested with brew before
#      it is pushed), and a pull request with the homebrew-core formula's
#      new checksum
#
# The publishing jobs run in the "release" environment: protect it (Settings,
# Environments) with required reviewers to approve each release by hand.
# Registry setup, once: crates.io and PyPI trusted publishers for this
# workflow and environment; on npm, publish 1.8.8 once with an NPM_TOKEN
# environment secret, then add the trusted publisher and delete the token.
# The Homebrew tap needs a HOMEBREW_TAP_TOKEN secret (a fine-grained token
# with contents: write on gunta/homebrew-tap only); without it that job
# says so and stops.

on:
  push:
    tags:
      - "turboblake-v*"

permissions: {}

concurrency:
  group: turboblake-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/turboblake-build.yml
    permissions:
      contents: read

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.files.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Files and checksums
        id: files
        run: |
          version=$(cat bend/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd dist
          rm -f blake3-*   # the test command lines, not for release
          # the npm add-ons by platform (directories): the npm package carries them
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -r -- {} +
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          scripts/release/notes.sh "$VERSION" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --draft --verify-tag --title "turboblake $VERSION" \
              --notes-file notes.md dist/*
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: dist/

  crates-io:
    needs: github-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Already on crates.io?
        id: there
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "turboblake-release (github.com/gunta/turboblake)" \
            "https://crates.io/api/v1/crates/turboblake/$VERSION")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
        if: steps.there.outputs.published == 'false'
        id: auth
      - name: cargo publish
        if: steps.there.outputs.published == 'false'
        working-directory: bend/crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          rustup update stable --no-self-update && rustup default stable
          cargo publish --locked

  npm:
    needs: github-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm
          path: dist
      - name: npm publish (trusted publishing, with provenance)
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
          # only for the first publish, before npm knows the trusted publisher
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "turboblake@$VERSION" version >/dev/null 2>&1; then
            echo "turboblake $VERSION is on npm already"
            exit 0
          fi
          # ./ makes it a file: a bare dir/name.tgz is read as a GitHub repository
          npm publish "./dist/turboblake-$VERSION.tgz" --access public --provenance

  pypi:
    needs: github-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  publish-release:
    needs: [crates-io, npm, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  go:
    needs: [publish-release, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # pushes the module's tag
      - name: Tag bend/go and ask the module proxy for it
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          tag="bend/go/v$VERSION"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          for _ in 1 2 3 4 5; do
            curl -fsS "https://proxy.golang.org/github.com/gunta/turboblake/bend/go/@v/v$VERSION.info" && exit 0
            sleep 30
          done
          echo "::warning::the Go module proxy does not list v$VERSION yet; go get will fetch it on first use"

  homebrew-tap:
    needs: [publish-release, github-release]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: dist
      - name: Write the formulas, and install and test them with brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          scripts/release/formulas.py tap dist/SHA256SUMS tap
          brew tap-new --no-git turboblake/ci >/dev/null
          cp tap/Formula/*.rb "$(brew --repository turboblake/ci)/Formula/"
          for f in turboblake libturboblake; do
            brew install --formula "turboblake/ci/$f"
            brew test "turboblake/ci/$f"
            brew audit --formula --strict "turboblake/ci/$f" || echo "::warning::brew audit $f"
          done
      - name: Push to gunta/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::no HOMEBREW_TAP_TOKEN secret: the tap was not updated (the formulas are in this job's log)"
            cat tap/Formula/*.rb
            exit 0
          fi
          git clone -q "https://x-access-token:${TOKEN}@github.com/gunta/homebrew-tap.git" homebrew-tap
          cp tap/Formula/*.rb homebrew-tap/Formula/
          cd homebrew-tap
          git config user.name "turboblake release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git diff --cached --quiet && { echo "the tap has these formulas already"; exit 0; }
          git commit -q -m "turboblake $VERSION, libturboblake $VERSION"
          git push -q origin HEAD

  homebrew-core:
    needs: [crates-io, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # pushes the branch for the pull request
          ref: master
      - name: Open a pull request with the crate's checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          # the .crate crates.io serves is the one cargo publish uploaded
          sha=$(curl -fsSL -A "turboblake-release (github.com/gunta/turboblake)" \
            "https://static.crates.io/crates/turboblake/turboblake-$VERSION.crate" | sha256sum | cut -c1-64)
          python3 scripts/release/formulas.py core "$sha"
          git diff --quiet && { echo "the formula has this version already"; exit 0; }
          branch="release/homebrew-core-$VERSION"
          git config user.name "turboblake release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -am "packaging: homebrew-core formula for turboblake $VERSION"
          git push -q origin "$branch"
          gh pr create --base master --head "$branch" --title "homebrew-core formula: turboblake $VERSION" \
            --body "The crates.io release's checksum for packaging/homebrew-core/turboblake.rb, from turboblake-release." \
            || echo "::warning::could not open the pull request (Settings, Actions: allow GitHub Actions to create pull requests); the branch $branch has the change"
