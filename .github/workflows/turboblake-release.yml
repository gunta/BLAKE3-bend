name: turboblake release

# Publishes turboblake everywhere, by itself, once a new version is on
# master and built:
#
#   0. a push to master that changes bend/VERSION (scripts/release/prepare.sh
#      X.Y.Z) runs turboblake-build.yml, which builds and tests every package
#      on every platform; when that run passes and its commit is still the
#      head of master, this workflow starts (workflow_run) and releases if
#      turboblake-v<version> does not exist yet. It takes the build's files;
#      nothing is built twice. A turboblake-v* tag pushed by hand (tag.sh)
#      still works: then this workflow builds first.
#   1. a draft GitHub release gets every file, SHA256SUMS, and a signed
#      build provenance attestation for each (gh attestation verify)
#   2. crates.io, npm and PyPI, each by trusted publishing (OIDC: no
#      long-lived token), each skipped if that version is already there, so
#      a failed run can simply be re-run
#   3. once all three have it, the release is published (which creates the
#      tag); then the Go module tag (bend/go/v<version>), the Homebrew tap
#      (tested with brew before it is pushed), and the homebrew-core
#      formula's new checksum, committed to master
#
# The publishing jobs run in the "release" environment (Settings,
# Environments): it admits master and turboblake-v* tags; required reviewers
# there make each release wait for a click. Registry setup, once: crates.io,
# PyPI and npm trusted publishers for this workflow and environment, so no
# registry token is stored. The Homebrew tap needs a HOMEBREW_TAP_TOKEN
# secret (a fine-grained token with contents: write on gunta/homebrew-tap
# only); without it that job says so and stops.

on:
  push:
    tags:
      - "turboblake-v*"
  # the plan job admits only a passing build of a push to this repository's master
  # by hand, from a passing turboblake build of master (its run id), without building again
  workflow_dispatch:
    inputs:
      build-run:
        description: "The run id of a passing turboblake build of master"
        required: true
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["turboblake build"]
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  group: turboblake-release
  cancel-in-progress: false

jobs:
  plan:
    # a build of a push to master in this repository, that passed (not a pull request's, not a fork's)
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      files: ${{ steps.plan.outputs.files }}
    steps:
      - name: Which build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_RUN: ${{ inputs.build-run }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          case "$EVENT" in
            push) echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "run=" >> "$GITHUB_OUTPUT" ;;
            workflow_run) echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"; echo "run=$RUN_ID" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              case "$INPUT_RUN" in ''|*[!0-9]*) echo "::error::build-run must be a run id"; exit 1 ;; esac
              info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_RUN" \
                --jq '[.name, .conclusion, .event, .head_branch, .head_sha] | join(" ")')
              read -r name1 name2 conclusion event branch sha <<< "$info"
              if [ "$name1 $name2" != "turboblake build" ] || [ "$conclusion" != success ] || [ "$event" != push ] || [ "$branch" != master ]; then
                echo "::error::run $INPUT_RUN is not a passing turboblake build of a push to master ($info)"
                exit 1
              fi
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "run=$INPUT_RUN" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.build.outputs.sha }}
      - name: A new version?
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ steps.build.outputs.sha }}
          BUILD_RUN: ${{ steps.build.outputs.run }}
          RUN: ${{ github.run_id }}
        run: |
          version=$(cat bend/VERSION)
          tag="turboblake-v$version"
          release=true
          if [ "$EVENT" = push ]; then
            python3 scripts/release/version.py check "$REF"
            files=$RUN
          else
            python3 scripts/release/version.py check
            files=$BUILD_RUN
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag exists: nothing to release"
              release=false
            else
              # a newer change to the packages on master gets its own build, which releases instead
              git fetch -q --depth=1 origin master
              newer=$(git diff --name-only "$SHA" FETCH_HEAD -- bend scripts/release .github/workflows/turboblake-build.yml \
                ':(exclude,glob)bend/**/*.md' ':(exclude)bend/bench')
              if [ -n "$newer" ]; then
                echo "master has newer package changes than $SHA; their build releases $tag:"
                echo "$newer"
                release=false
              fi
            fi
            if [ "$release" = true ]; then
              echo "releasing $tag from $SHA"
            fi
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$SHA"
            echo "files=$files"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && github.event_name == 'push'
    uses: ./.github/workflows/turboblake-build.yml
    permissions:
      contents: read

  github-release:
    needs: [plan, build]
    # build is skipped when the files come from master's build; a skipped job
    # upstream skips every job after it unless it says otherwise, as each one here does
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.files }}
          github-token: ${{ github.token }}
      - name: Files and checksums
        run: |
          cd dist
          rm -f blake3-*   # the test command lines, not for release
          # the npm add-ons by platform (directories): the npm package carries them
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -r -- {} +
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/release/notes.sh "$VERSION" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            # the tag exists (pushed by hand) or is made on $SHA when the release is published
            gh release create "$TAG" --draft --target "$SHA" --title "turboblake $VERSION" \
              --notes-file notes.md dist/*
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: dist/

  crates-io:
    needs: [plan, github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - name: Already on crates.io?
        id: there
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "turboblake-release (github.com/gunta/turboblake)" \
            "https://crates.io/api/v1/crates/turboblake/$VERSION")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
        if: steps.there.outputs.published == 'false'
        id: auth
      - name: cargo publish
        if: steps.there.outputs.published == 'false'
        working-directory: bend/crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          rustup update stable --no-self-update && rustup default stable
          cargo publish --locked

  npm:
    needs: [plan, github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm
          path: dist
          run-id: ${{ needs.plan.outputs.files }}
          github-token: ${{ github.token }}
      - name: npm publish (trusted publishing, with provenance)
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        # no token: npm trusts this workflow in the release environment (OIDC, id-token above)
        run: |
          if npm view "turboblake@$VERSION" version >/dev/null 2>&1; then
            echo "turboblake $VERSION is on npm already"
            exit 0
          fi
          # ./ makes it a file: a bare dir/name.tgz is read as a GitHub repository
          npm publish "./dist/turboblake-$VERSION.tgz" --access public --provenance

  pypi:
    needs: [plan, github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist
          run-id: ${{ needs.plan.outputs.files }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.files }}
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  publish-release:
    needs: [plan, crates-io, npm, pypi]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  go:
    needs: [plan, publish-release, github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # pushes the module's tag
          ref: ${{ needs.plan.outputs.sha }}
      # tag.sh pushes bend/go/vX.Y.Z with a tag made by hand; a release from master makes it here
      - name: Tag bend/go, and ask the module proxy for it
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          tag="bend/go/v$VERSION"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$SHA"
            git push origin "refs/tags/$tag"
          fi
          for _ in 1 2 3 4 5; do
            curl -fsS "https://proxy.golang.org/github.com/gunta/turboblake/bend/go/@v/v$VERSION.info" && exit 0
            sleep 30
          done
          echo "::warning::the Go module proxy does not list v$VERSION yet; go get will fetch it on first use"

  homebrew-tap:
    needs: [plan, publish-release, github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: dist
      - name: Write the formulas, and install and test them with brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          scripts/release/formulas.py tap dist/SHA256SUMS tap
          brew tap-new --no-git turboblake/ci >/dev/null
          cp tap/Formula/*.rb "$(brew --repository turboblake/ci)/Formula/"
          for f in turboblake libturboblake; do
            brew install --formula "turboblake/ci/$f"
            brew test "turboblake/ci/$f"
            brew audit --formula --strict "turboblake/ci/$f" || echo "::warning::brew audit $f"
          done
      - name: Push to gunta/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::no HOMEBREW_TAP_TOKEN secret: the tap was not updated (the formulas are in this job's log)"
            cat tap/Formula/*.rb
            exit 0
          fi
          git clone -q "https://x-access-token:${TOKEN}@github.com/gunta/homebrew-tap.git" homebrew-tap
          cp tap/Formula/*.rb homebrew-tap/Formula/
          cd homebrew-tap
          git config user.name "turboblake release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git diff --cached --quiet && { echo "the tap has these formulas already"; exit 0; }
          git commit -q -m "turboblake $VERSION, libturboblake $VERSION"
          git push -q origin HEAD

  homebrew-core:
    needs: [plan, crates-io, github-release]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # pushes the formula to master
          ref: master
      - name: Commit the crate's checksum to packaging/homebrew-core
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          # the .crate crates.io serves is the one cargo publish uploaded
          sha=$(curl -fsSL -A "turboblake-release (github.com/gunta/turboblake)" \
            "https://static.crates.io/crates/turboblake/turboblake-$VERSION.crate" | sha256sum | cut -c1-64)
          git config user.name "turboblake release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            git fetch -q origin master && git reset -q --hard origin/master
            python3 scripts/release/formulas.py core "$sha"
            git diff --quiet && { echo "the formula has this version already"; exit 0; }
            git commit -q -am "packaging: homebrew-core formula for turboblake $VERSION"
            git push -q origin HEAD:master && exit 0
            sleep 5
          done
          echo "::error::could not push the formula to master"
          exit 1
