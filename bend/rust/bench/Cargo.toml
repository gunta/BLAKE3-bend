[package]
name = "turboblake-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the repository's workspace.
[workspace]

[dependencies]
official = { package = "blake3", path = "../../..", features = ["rayon"] }
bend = { package = "turboblake", path = "../../crate", default-features = false, features = ["std", "rayon"] }

[profile.release]
codegen-units = 1
