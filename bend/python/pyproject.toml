[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blake3-bend"
version = "1.8.7"
description = "BLAKE3, with big inputs hashed on every core by a Bend2 engine: a drop-in for the blake3 module"
readme = "README.md"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://gunta.github.io/BLAKE3-bend/"
Repository = "https://github.com/gunta/BLAKE3-bend"

[tool.setuptools]
packages = ["blake3"]

[tool.setuptools.package-data]
blake3 = ["py.typed", "__init__.pyi"]
